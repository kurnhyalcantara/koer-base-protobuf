syntax = "proto3";

package auth.v1;

option go_package = "github.com/kurnhyalcantara/koer-base-protobuf/gen/go/auth-service/v1;authv1";

// AuthService provides methods for user authentication and token validation.
service AuthService {
  // Login performs an authentication operation using credentials.
  rpc Login(LoginRequest) returns (LoginResponse) {}

  // ValidateToken verifies whether an access token is valid.
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse) {}
}

// LoginRequest contains the credentials to log in.
message LoginRequest {
  string email = 1;
  string password = 2;
}

// LoginResponse contains the authentication token logic.
message LoginResponse {
  string token = 1;
}

// ValidateTokenRequest accepts an encoded access token for validation.
message ValidateTokenRequest {
  string token = 1;
}

// ValidateTokenResponse returns the validity state and associated user details.
message ValidateTokenResponse {
  bool is_valid = 1;
  string user_id = 2;
}
